<section class="container py-xl">
    <div class="text-center mb-lg">
        <h1>Kontakt</h1>
        <p>Wir freuen uns von dir zu hören!</p>
    </div>
    
    <div style="background: white; padding: 2rem; border-radius: var(--radius-md); box-shadow: var(--shadow-sm); max-width: 600px; margin: 0 auto;">
        <form style="display: flex; flex-direction: column; gap: 1rem;">
            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                <label for="name">Name</label>
                <input type="text" id="name" style="padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;" required>
            </div>
            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                <label for="email">E-Mail</label>
                <input type="email" id="email" style="padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;" required>
            </div>
            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                <label for="message">Nachricht</label>
                <textarea id="message" rows="5" style="padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;" required></textarea>
            </div>
            <button type="submit" class="btn mt-lg">Senden</button>
        </form>
    </div>
</section>
